<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mintlify - clone</title>
  <link rel="shortcut icon" href="./public/mintlify-logo.jpeg" type="image/x-icon">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="./src/style.css">

</head>

<body>


  <nav>
    <div class="nav-logo">
      <img src="./public/logo-full.webp" alt="Mintlify logo">
    </div>
    <div class="nav-mid">
      <a href="#">Resources</a>
      <a href="#">Documentation</a>
      <a href="#">Customers</a>
      <a href="#">Blog</a>
      <a href="#">Pricing</a>
    </div>
    <div class="nav-btns">
      <button class="cta-btn contact-sales">Contact sales</button>
      <button class="cta-btn start-free">Start for free</button>
    </div>
  </nav>
  <main>
    <div class="hero">
      <div class="hero-top"><span>NEW</span>
        Self-updating docs with agent suggestions
        <i class="fa-solid fa-circle-chevron-right"></i>
      </div>
      <div class="hero-mid">
        <h2>The Intelligent<br>Knowledge Platform</h2>
        <p>Helping teams create and maintain world-class <br> documentation built for both humans and AI</p>
      </div>
      <div class="hero-bt">
        <input type="email" placeholder="Email address">
        <button>Start now</button>
      </div>
      <div class="hero-img">
        <img src="./public/hero-image-dark.svg" alt="">
      </div>
    </div>
  </main>
</body>

</html>
